name: Build APK Capacitor
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar proyecto Android
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6
          npx cap add android
          if [ -n "$GS" ]; then printf '%s' "$GS" > android/app/google-services.json; else echo "AVISO: falta el secreto GOOGLE_SERVICES_JSON; la app saldrá sin notificaciones"; fi
          npx cap sync android
      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: apk-capacitor
          path: android/app/build/outputs/apk/debug/app-debug.apk
