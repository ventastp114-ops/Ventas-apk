name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Configurar Bubblewrap
        run: |
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
      - name: Crear llave de firma
        run: |
          keytool -genkeypair -keystore android.keystore -alias ventas \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ventas123456 -keypass ventas123456 \
            -dname "CN=Ventas, O=Ventas, C=MX"
      - name: Construir APK
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ventas123456
          BUBBLEWRAP_KEY_PASSWORD: ventas123456
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: app-release-signed.apk
